name: Repack Termux release

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "上游版本，留空 = @deepseek-ai/dsh@latest"
        required: false
        default: ""
      rev:
        description: "同上游版本的修订号，留空 = 1"
        required: false
        default: ""
      dry_run:
        description: "只构建不发布"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repack-termux
  cancel-in-progress: false

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build file patch python3
          npm install -g node-gyp@11

      - name: Resolve Android NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          NDK_ROOT=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK_ROOT" ]; then
            echo "::error::runner 上没有 Android NDK（$SDK/ndk）"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK = $NDK_ROOT"

      - name: Repack
        env:
          REV: ${{ inputs.rev }}
        run: |
          bash repack/repack.sh "${{ inputs.upstream_version }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dsh-termux
          path: |
            dist/dsh-termux.tgz
            dist/dsh-termux.tgz.sha256
            dist/version.txt
            dist/release-notes.md

      - name: Publish release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat dist/version.txt)
          gh release delete "v$V" --yes --cleanup-tag || true
          gh release create "v$V" dist/dsh-termux.tgz dist/dsh-termux.tgz.sha256 \
            --title "dsh $V (Termux arm64)" --prerelease \
            --notes-file dist/release-notes.md
